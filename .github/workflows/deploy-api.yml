name: Deploy API

on:
  push:
    branches:
      - main
    paths:
      - "src/TimeBinTracker.API/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install AWS Lambda .NET tools
        run: dotnet tool install --global Amazon.Lambda.Tools

      - name: Package Lambda
        working-directory: src/TimeBinTracker.API
        run: dotnet lambda package --configuration Release --function-runtime dotnet10 --output-package bin/Release/function.zip

      - name: Deploy Lambda code
        run: aws --no-cli-pager lambda update-function-code --function-name time-bin-tracker-lambda --zip-file fileb://src/TimeBinTracker.API/bin/Release/function.zip --region us-east-2
