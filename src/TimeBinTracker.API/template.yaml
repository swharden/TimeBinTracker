AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Resources:
  Api:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: TimeBinTracker.API
      Runtime: dotnet10
      Architectures:
        - x86_64
      MemorySize: 256
      Timeout: 30
      Events:
        Create:
          Type: HttpApi
          Properties:
            Path: /
            Method: POST
        Query:
          Type: HttpApi
          Properties:
            Path: /
            Method: GET
